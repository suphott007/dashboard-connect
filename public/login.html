<!DOCTYPE html>
<html lang="th" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>เข้าสู่ระบบ & ส่งข้อความ - Dashboard Connect</title>
  <!-- Google Fonts: Inter & Kanit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Kanit', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    /* Prevent zoom on inputs in iOS */
    input, textarea {
      font-size: 16px !important;
    }
  </style>
</head>
<body class="h-full flex flex-col justify-between font-sans selection:bg-indigo-500 selection:text-white bg-gradient-to-b from-slate-900 via-slate-900 to-slate-950 p-4 sm:p-6">

  <!-- Header -->
  <header class="w-full max-w-md mx-auto pt-4 pb-2 flex items-center justify-between">
    <div class="flex items-center space-x-2.5">
      <div class="h-9 w-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
        </svg>
      </div>
      <div>
        <span class="text-sm font-bold text-white tracking-tight">Dashboard Connect</span>
        <div class="flex items-center gap-1.5">
          <span id="connectionDot" class="w-2 h-2 rounded-full bg-amber-400"></span>
          <span id="connectionStatus" class="text-[11px] text-slate-400">กำลังเชื่อมต่อ...</span>
        </div>
      </div>
    </div>

    <!-- Switch to Dashboard link -->
    <a href="/" class="text-xs text-slate-400 hover:text-indigo-300 underline transition-colors">
      ดูหน้าจอ Dashboard
    </a>
  </header>

  <!-- Main Content Container -->
  <main class="w-full max-w-md mx-auto my-auto py-4">

    <!-- STEP 1: LOGIN CARD (Initial state) -->
    <div id="loginCard" class="bg-slate-800/90 rounded-2xl p-6 border border-slate-700/80 shadow-2xl backdrop-blur">
      <div class="text-center mb-6">
        <div class="w-14 h-14 mx-auto mb-3 rounded-2xl bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center text-indigo-400 shadow-inner">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </div>
        <h2 class="text-xl font-bold text-white">เข้าสู่ระบบ</h2>
        <p class="text-xs text-slate-400 mt-1">กรอกชื่อของคุณเพื่อเริ่มส่งข้อความไปยังหน้า Dashboard</p>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label for="usernameInput" class="block text-xs font-medium text-slate-300 mb-1.5">ชื่อของคุณ <span class="text-rose-400">*</span></label>
          <div class="relative">
            <input 
              type="text" 
              id="usernameInput" 
              required
              maxlength="50"
              autocomplete="name"
              placeholder="เช่น สมชาย, Somchai" 
              class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
            />
          </div>
        </div>

        <button 
          type="submit" 
          id="loginSubmitBtn"
          class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-medium py-3 px-4 rounded-xl shadow-lg shadow-indigo-600/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-sm"
        >
          <span>เข้าสู่ระบบ (Login)</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </button>
      </form>
    </div>

    <!-- STEP 2: SEND MESSAGE CARD (Shown after login) -->
    <div id="messageCard" class="hidden bg-slate-800/90 rounded-2xl p-6 border border-slate-700/80 shadow-2xl backdrop-blur">
      
      <!-- User profile header -->
      <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-700/80">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white font-bold text-sm shadow-md">
            <span id="userAvatarText">U</span>
          </div>
          <div>
            <div class="text-[11px] text-slate-400">เข้าสู่ระบบในชื่อ:</div>
            <div id="displayUsername" class="text-sm font-bold text-white truncate max-w-[150px]">ผู้ใช้งาน</div>
          </div>
        </div>

        <button id="logoutBtn" class="text-xs text-rose-400 hover:text-rose-300 px-2.5 py-1 rounded-lg bg-rose-500/10 border border-rose-500/20 transition-colors">
          เปลี่ยนชื่อ
        </button>
      </div>

      <!-- Message Form -->
      <form id="messageForm" class="space-y-4">
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="messageInput" class="text-xs font-medium text-slate-300">ข้อความที่ต้องการส่ง <span class="text-rose-400">*</span></label>
            <span id="charCount" class="text-[11px] text-slate-400">0 / 500</span>
          </div>
          <textarea 
            id="messageInput" 
            rows="4" 
            maxlength="500"
            required
            placeholder="พิมพ์ข้อความที่นี่เพื่อส่งขึ้นหน้า Dashboard..." 
            class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all resize-none"
          ></textarea>
        </div>

        <!-- Notification Toast within card -->
        <div id="toastNotification" class="hidden rounded-xl p-3 text-xs flex items-center gap-2 border transition-all"></div>

        <button 
          type="submit" 
          id="sendMessageBtn"
          class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-medium py-3 px-4 rounded-xl shadow-lg shadow-indigo-600/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-sm"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
          </svg>
          <span>ส่งข้อความไปที่ Dashboard</span>
        </button>
      </form>

      <!-- Sent History Section -->
      <div id="myHistorySection" class="mt-6 pt-4 border-t border-slate-700/60 hidden">
        <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2.5">ข้อความล่าสุดที่คุณเพิ่งส่ง</h4>
        <div id="myHistoryList" class="space-y-2 max-h-40 overflow-y-auto"></div>
      </div>

    </div>

  </main>

  <!-- Footer -->
  <footer class="w-full max-w-md mx-auto text-center py-3 text-xs text-slate-500">
    Dashboard Connect &bull; Realtime Communication
  </footer>

  <!-- Socket.io & Mobile Client JS -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/client.js"></script>
</body>
</html>
